<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% if page.url == '/' %}{{ site.title }} | {{ site.author.name }}{% elsif page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | {{ site.author.name }}{% endif %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#eef0f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">

  {% include seo.html %}

  <link rel="preload" href="/assets/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/public-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="/atom.xml">
  <link rel="stylesheet" href="/assets/css/site.css">
</head>

<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <a href="/" class="nav-name">NonnoAlex</a>
    <nav class="site-nav" aria-label="Main">
      <ul>
        <li><a href="/blog/"{% if page.url contains '/blog/' or page.layout == 'post' %} aria-current="page"{% endif %}>Notes</a></li>
        <li><a href="/about/"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a></li>
        <li><a href="/contact/"{% if page.url == '/contact/' %} aria-current="page"{% endif %}>Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; {{ site.time | date: '%Y' }} Alessandro Lo Manto</span>
      <ul>
        <li><a href="/about/">About</a></li>
        <li><a href="/contact/">Contact</a></li>
        <li><a href="/privacy/">Privacy</a></li>
        <li><a href="/atom.xml">Feed</a></li>
        <li><a href="/llms.txt">llms.txt</a></li>
      </ul>
    </div>
  </footer>
</body>
</html>
