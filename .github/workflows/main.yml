name: pipeline

on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

env:
  HELM_RELEASE: nonnoalex-website
  IMAGE: docker.nonnoalex.dev/nonnoalex/nonnoalex-website
  KUBE_NAMESPACE: nonnoalex-website

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: ./test.sh

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Read release version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Validate production settings
        env:
          K3S_TAILSCALE_HOST: ${{ vars.K3S_TAILSCALE_HOST }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          test -n "$K3S_TAILSCALE_HOST"
          test -n "$KUBE_CONFIG"
          test -n "$VERSION"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: docker.nonnoalex.dev
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest

      - name: Connect to the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.K3S_TAILSCALE_HOST }}

      - name: Configure Kubernetes
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/kube"
          printf '%s' "$KUBE_CONFIG" > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

      - name: Deploy
        run: |
          helm upgrade --install "$HELM_RELEASE" ./helm/nonnoalex-website \
            --namespace "$KUBE_NAMESPACE" \
            --set-string image.repository="$IMAGE" \
            --set-string image.tag="$VERSION" \
            --atomic \
            --wait \
            --timeout 5m
