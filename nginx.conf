types {
    text/markdown md;
}

map $http_accept $preferred_ext {
    default           ".html";
    "~*text/markdown" ".md";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/markdown;

    add_header Vary "Accept, Accept-Encoding" always;
    error_page 404 /404$preferred_ext;

    location / {
        try_files $uri$preferred_ext $uri/index$preferred_ext $uri $uri/ $uri.html $uri/index.html =404;
    }
}
